# 集成测试专用配置：独立测试库，不污染开发数据
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dsmarket_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      # 【安全】同 application-dev.yml：与 docker-compose.yml 读的是同名变量 REDIS_PASSWORD，
      # 但那是**两处独立展开**（同名 ≠ 必然一致），只给一边设就会错配。
      # 容器现在带 requirepass，缺了这行集成测试里所有碰 Redis 的用例都会失败。
      password: ${REDIS_PASSWORD:dsm_dev_redis}

mybatis-plus:
  configuration:
    # 测试环境关闭 SQL 日志，避免输出噪音
    map-underscore-to-camel-case: true

security:
  auth-rate-limit:
    # 【为什么是"抬高阈值"而不是 enabled: false】
    #
    # 关掉能力是这类改动里最容易造出假 PASS 的做法：限流整段写坏了，"其余 600+ 用例全绿"
    # 也照样成立，因为没有任何用例碰过它。这里保持 enabled=true 让代码路径真的跑起来
    # （INCR、EXPIRE、比较都执行），只把阈值抬到不可能达到。
    #
    # 【不这样做会踩的坑】MockMvc 的 remoteAddr 恒为 127.0.0.1，且 Redis 跨测试轮次【不】清空：
    #   - 登录限流按失败计数，而 MalformedRequestContractIntegrationTest 每次运行都会做
    #     一次失败登录（用户名 nobody）—— 阈值若取默认 5，本地连跑 5 次后该用例就会收到
    #     429，现场看起来像一次毫无关联的回归。
    #   - 注册按尝试计数，阈值同理。
    # 真实阈值由 AuthRateLimitIntegrationTest 用 @SpringBootTest(properties=...) 显式下调来验证。
    account-limit: 1000000
    ip-limit: 1000000
    register-limit: 1000000
