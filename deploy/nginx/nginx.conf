# ============================================
# DSMarket 生产 Nginx 配置（完整版，本机模拟生产直接可用）
#
# Windows 本机：复制到 nginx 安装目录 conf/nginx.conf 后启动
#   （root 已指向本项目 dist，proxy_pass 指向本机后端 8080）
# Linux 云服务器：root 改为 /opt/dsmarket/frontend/dist，proxy_pass 保持 127.0.0.1:8080
# Docker 容器场景：proxy_pass 改为 http://host.docker.internal:8080
#
# 职责：
#   1. serving 前端构建产物 dist/（SPA 路由 fallback 到 index.html）
#   2. 反向代理 /api 与 /uploads 到后端 Spring Boot
# ============================================
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       8088;   # Windows 本机 80 端口常被系统占用，用 8088；Linux 生产可改回 80
        server_name  localhost;

        # 前端构建产物目录（Linux 生产改为 /opt/dsmarket/frontend/dist）
        set $dsm_dist "D:/AMyProgram/DarkSea_Market_Main/frontend/dist";
        # 后端地址（Linux 生产保持 127.0.0.1:8080；Docker 容器内改 host.docker.internal:8080）
        set $dsm_backend http://127.0.0.1:8080;

        # 静态资源（带缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            root $dsm_dist;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # 前端页面：SPA 路由 fallback
        location / {
            root $dsm_dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 健康检查（审计 12-readiness-audit §2.7）。
        #
        # 【这一条不能省】没有它，/healthz 会落到下面的 `location /`，
        # 经 try_files 兜到 index.html —— **后端已经死了也回 200 + 一段 HTML**，
        # 于是盯这个地址的监控会一直绿。那不是"还没配探针"，是配了一个恒绿的探针。
        # `=` 前缀是精确匹配、优先级最高，保证它不会被上面的 .jpg 正则或 `location /` 抢走。
        location = /healthz {
            # proxy_pass 带变量时不走"替换 location 前缀"那套规则，指令里写什么 URI 就发什么 URI，
            # 故这里必须把 /actuator/health 写全，不能只写 $dsm_backend。
            proxy_pass         $dsm_backend/actuator/health;
            proxy_connect_timeout 2s;
            proxy_read_timeout    2s;
            access_log off;    # 探针频率高，不留访问日志
        }

        # 后端 API
        location /api/ {
            proxy_pass         $dsm_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout  30s;
        }

        # 上传文件（商品图/头像，由后端磁盘映射 /uploads/**）
        # ^~ 前缀优先，避免被下方 .jpg 静态资源正则 location 抢先匹配
        location ^~ /uploads/ {
            proxy_pass         $dsm_backend;
            proxy_set_header   Host $host;
            expires 7d;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
